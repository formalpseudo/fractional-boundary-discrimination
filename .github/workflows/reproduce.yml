name: Core reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/reproduce_core.py
      - run: python code/validate_v4.py
      - run: python -c "import json; assert json.load(open('reports/VALIDATION_V4.json'))['passed']"
